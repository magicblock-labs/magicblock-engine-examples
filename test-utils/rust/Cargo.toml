[package]
name = "test-utils"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[features]
default = []
sdk = ["dep:ephemeral-rollups-sdk"]
anchor = ["dep:anchor-lang", "sdk", "ephemeral-rollups-sdk/anchor"]

[dependencies]
anchor-lang = { version = "=1.0.2", optional = true }
ephemeral-rollups-sdk = { version = "0.16.2", optional = true }
magicsvm = "0.2.0"
solana-address = "~2.6.1"
solana-hash = "~4.5.0"
solana-instruction = { version = "~3.4.0", features = ["bincode"] }
solana-keypair = "3.1.2"
solana-message = "4.2.4"
serde_json = "1"
solana-signer = "3.0.1"
solana-transaction = { version = "4.1.5", features = ["verify"] }
