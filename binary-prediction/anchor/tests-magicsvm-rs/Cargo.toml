[package]
name = "binary-prediction-magicsvm-tests"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dev-dependencies]
anchor-lang = "=1.0.2"
binary-prediction = { path = "../programs/binary-prediction", features = ["no-entrypoint"] }
ephemeral-rollups-sdk = { version = "0.16.2", features = ["anchor"] }
magicsvm = "0.2.0"
test-utils = { path = "../../../test-utils/rust", features = ["anchor"] }
session-keys = { version = "=3.1.1", features = ["no-entrypoint"] }
solana-address = "~2.6.1"
solana-clock = "~3.1.1"
solana-hash = "~4.5.0"
solana-instruction = { version = "~3.4.0", features = ["bincode"] }
solana-keypair = "3.1.2"
solana-message = "4.2.4"
solana-native-token = "3.0.0"
solana-sdk-ids = "3.1.0"
solana-signer = "3.0.1"
solana-system-interface = "3.2.0"
solana-transaction = { version = "4.1.5", features = ["verify"] }
