[package]
name = "oncurve-delegation-magicsvm-rs"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
borsh = "1.6.1"
dlp_api = { package = "magicblock-delegation-program-api", version = "3.0.0", default-features = false, features = [
    "instruction",
] }
ephemeral-rollups-sdk = { version = "0.14.4", default-features = false }
magicsvm = "0.2.0"
test-utils = { path = "../../../test-utils/rust" }
solana-address = "~2.6.1"
solana-instruction = { version = "~3.4.0", features = ["bincode"] }
solana-keypair = "3.1.2"
solana-message = "4.2.4"
solana-native-token = "3.0.0"
solana-sdk-ids = "3.1.0"
solana-signer = "3.0.1"
solana-system-interface = "3.2.0"
solana-transaction = { version = "4.1.5", features = ["verify"] }
