[package]
name = "magic-actions-magicsvm-tests"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dev-dependencies]
anchor-lang = "=1.0.2"
ephemeral-rollups-sdk = { version = "0.16.2", features = ["anchor"] }
magic-actions = { path = "../programs/magic-actions", features = ["no-entrypoint"] }
magicsvm = "0.2.0"
test-utils = { path = "../../../test-utils/rust", features = ["anchor"] }
solana-address = "~2.6.1"
solana-instruction = { version = "~3.4.0", features = ["bincode"] }
solana-keypair = "3.1.2"
solana-message = "4.2.4"
solana-native-token = "3.0.0"
solana-signer = "3.0.1"
solana-transaction = { version = "4.1.5", features = ["verify"] }
solana-transaction-error = "~3.3.1"
